<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід до інформаційної системи</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            width: 260px;
        }
        h2 {
            font-size: 16px;
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        button {
            width: 100%;
            padding: 8px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Вхід до інформаційної системи</h2>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit">Увійти</button>
<div style="margin-top: 8px; font-size: 11px;">
    <input type="checkbox" id="showPassword" onclick="togglePassword()"> Показати пароль
</div>
    </form>

    <div id="message"></div>

    <script src="popup.js"></script>
    <--Додано перевірку валідації пароля-->
</body>
</html>
